name: CI-CD DevOps Proyecto

on:
  push:
    branches:
      - deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login en ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 327940345200.dkr.ecr.us-east-1.amazonaws.com

      - name: Build y push frontend
        run: |
          docker build --build-arg VITE_API_URL=http://innovatech-alb-1247484730.us-east-1.elb.amazonaws.com \
            -t 327940345200.dkr.ecr.us-east-1.amazonaws.com/innovatech-frontend:latest ./frontend
          docker push 327940345200.dkr.ecr.us-east-1.amazonaws.com/innovatech-frontend:latest

      - name: Build y push backend
        run: |
          docker build \
            -t 327940345200.dkr.ecr.us-east-1.amazonaws.com/innovatech-backend:latest ./backend
          docker push 327940345200.dkr.ecr.us-east-1.amazonaws.com/innovatech-backend:latest

  deploy-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy en EC2 frontend y backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 327940345200.dkr.ecr.us-east-1.amazonaws.com

            docker pull 327940345200.dkr.ecr.us-east-1.amazonaws.com/innovatech-frontend:latest
            docker pull 327940345200.dkr.ecr.us-east-1.amazonaws.com/innovatech-backend:latest

            docker rm -f innovatech-frontend || true
            docker rm -f innovatech-backend || true

            docker run -d --name innovatech-frontend --restart always -p 80:80 327940345200.dkr.ecr.us-east-1.amazonaws.com/innovatech-frontend:latest

            docker run -d --name innovatech-backend --restart always \
              -e PORT=3001 \
              -e DB_HOST=172.31.23.138 \
              -e DB_PORT=3306 \
              -e DB_NAME=innovatech_ops \
              -e DB_USER=app_user \
              -e DB_PASSWORD=app_secret \
              -e CORS_ORIGIN=http://innovatech-alb-1247484730.us-east-1.elb.amazonaws.com \
              -p 3001:3001 \
              327940345200.dkr.ecr.us-east-1.amazonaws.com/innovatech-backend:latest