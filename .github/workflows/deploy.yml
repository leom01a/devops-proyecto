name: CI-CD DevOps Proyecto - Amazon ECS (EP3)

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # 1. Configurar credenciales de AWS (Usa el Session Token obligatorio para AWS Academy)
      - name: Configurar AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # 2. Login en Amazon ECR usando la acción oficial
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 3. Build y Push Frontend a tu repositorio ECR
      - name: Build y Push Frontend
        run: |
          docker build --build-arg VITE_API_URL="http://innovatech-alb-1247484730.us-east-1.elb.amazonaws.com" \
            -t 327940345200.dkr.ecr.us-east-1.amazonaws.com/innovatech-frontend:latest ./frontend
          docker push 327940345200.dkr.ecr.us-east-1.amazonaws.com/innovatech-frontend:latest

      # 4. Build y Push Backend a tu repositorio ECR
      - name: Build y Push Backend
        run: |
          docker build \
            -t 327940345200.dkr.ecr.us-east-1.amazonaws.com/innovatech-backend:latest ./backend
          docker push 327940345200.dkr.ecr.us-east-1.amazonaws.com/innovatech-backend:latest

      # 5. DESPLIEGUE EN EL ORQUESTADOR NATIVO (Amazon ECS)
      # Reemplaza completamente a SSH/EC2 gatillando un Rolling Update automático.
      - name: Deploy en Amazon ECS
        run: |
          echo "Actualizando servicio Backend en ECS..."
          aws ecs update-service --cluster innovatech-cluster --service innovatech-backend --force-new-deployment
          
          echo "Actualizando servicio Frontend en ECS..."
          aws ecs update-service --cluster innovatech-cluster --service innovatech-frontend --force-new-deployment