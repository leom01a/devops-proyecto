name: CI-CD DevOps Proyecto

on:
  push:
    branches:
      - deploy

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build frontend
        run: |
          docker build -t bpy4shn/frontend:latest ./frontend
          docker push bpy4shn/frontend:latest

      - name: Build backend
        run: |
          docker build -t bpy4shn/backend:latest ./backend
          docker push bpy4shn/backend:latest